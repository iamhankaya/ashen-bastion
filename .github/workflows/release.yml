name: release
# Yalnız elle (workflow_dispatch) ya da sürüm etiketi (v*) ile koşar; push/PR'da koşmaz.
# pull_request / pull_request_target YOKTUR: fork PR'ları secret'lara erişemez.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ashen-bastion
          key: godot-export-${{ hashFiles('.godot-version') }}
      - name: İmzalı release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AB_VERSION_CODE: ${{ github.run_number }}
          AB_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: bash tools/ci/export_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ashen-bastion-release-apk
          path: build/ab-release.apk
          if-no-files-found: error
          retention-days: 30
  publish:
    # Yalnız etiket: APK'yı GitHub Release'e koyar. Secret kullanmaz.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ashen-bastion-release-apk
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" ab-release.apk#ashen-bastion-"$TAG".apk \
            --repo "$GITHUB_REPOSITORY" --title "Ashen Bastion $TAG" --notes "İmzalı release APK (arm64)."
