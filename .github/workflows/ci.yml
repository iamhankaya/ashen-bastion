name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.5.0" pytest pillow numpy scipy soundfile pyloudnorm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ashen-bastion
          key: godot-${{ hashFiles('.godot-version') }}
      - run: bash tools/gate.sh
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.5.0" pytest pillow numpy scipy soundfile pyloudnorm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ashen-bastion
          key: godot-${{ hashFiles('.godot-version') }}
      - run: bash tools/ci/selftest_gate.sh
  export-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ashen-bastion
          key: godot-export-${{ hashFiles('.godot-version') }}
      - run: bash tools/ci/export_debug.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ashen-bastion-debug-apk
          path: build/ab-debug.apk
          if-no-files-found: error
  release-prova:
    # Release betiğinin olumsuz yolları (secret yok/yanlış); Godot/SDK gerekmez, gerçek secret kullanılmaz.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/ci/prova_release.sh --fast
