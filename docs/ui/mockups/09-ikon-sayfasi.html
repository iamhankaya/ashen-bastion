<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>İkon sayfası — Ashen Bastion UI maketi</title><link rel="stylesheet" href="ui.css">
<style>.g{zoom:.8;display:grid;grid-template-columns:repeat(3,1fr);gap:36px;padding:72px 54px}.c{background:var(--mor-800);border:4px solid var(--bronz-700);border-radius:18px;padding:27px;text-align:center}.c .f{position:relative;width:224px;height:224px;margin:0 auto 18px}.c .f img{position:absolute}.c b{font:700 30px var(--f-display);display:block}.c i{font:400 24px Inter;color:var(--kemik-300);font-style:normal}.sm{display:flex;gap:18px;justify-content:center;margin-top:18px}</style></head><body><main class="screen">
<div style="padding:96px 54px 0"><div class="title" style="font-size:64px;text-align:left">İKON SAYFASI</div><p style="font:400 30px/1.4 Inter;color:#CFC4AE;margin-top:18px">96×96 vektör · düz dolgu + 4 px koyu kontur · bronz/kemik vurgu · tek amber vurgu rengi. Çerçeve rolü türü gösterir: kare = aktif, daire = pasif, sekizgen = evrim.</p></div>
<div class="g" id="g"></div>
<script>
const L=[['seken-mermi','Seken Mermi','aktif'],['yelpaze-atis','Yelpaze Atış','aktif'],['dinamit','Dinamit','aktif'],['son-mermi-patlar','Son Mermi Patlar','aktif'],['barut-kesesi','Barut Kesesi','pasif'],['hizli-doldurma','Hızlı Doldurma','pasif'],['fazladan-mermi','Fazladan Mermi','pasif'],['zincirleme-patlama','Zincirleme Patlama','evrim'],['hud-can','HUD · Can','yok'],['hud-xp','HUD · Deneyim','yok'],['hud-mermi','HUD · Mermi','yok'],['hud-oldurme','HUD · Öldürme','yok'],['hud-sure','HUD · Süre','yok'],['hud-duraklat','HUD · Duraklat','yok']];
document.getElementById('g').innerHTML=L.map(([f,n,k])=>{const fr=k=='yok'?'':`<img src="../../../art/ui/frames/cerceve-${k}.svg" style="left:0;top:0;width:224px;height:224px" alt="">`;const gl=k=='yok'?'left:20px;top:20px;width:184px;height:184px':'left:46px;top:46px;width:132px;height:132px';return `<div class="c"><div class="f">${fr}<img src="../../../art/ui/icons/${f}.svg" style="${gl}" alt=""></div><b>${n}</b><i>${k=='yok'?'çerçevesiz':k+' çerçeve'}</i><div class="sm">${k=='yok'?'':`<span style="position:relative;width:78px;height:78px;display:block"><img src="../../../art/ui/frames/cerceve-${k}.svg" style="width:78px;height:78px;position:absolute;left:0;top:0" alt=""><img src="../../../art/ui/icons/${f}.svg" style="width:54px;height:54px;position:absolute;left:12px;top:12px" alt=""></span>`}<img src="../../../art/ui/icons/${f}.svg" style="width:48px;height:48px" alt=""></div></div>`}).join('');
</script></main></body></html>
