name: v202-forced
# GEÇİCİ (T20261029-04 R0 madde 17): yalnız bu dalda push ile koşar; R0 bitince silinir.
on:
  push:
    branches: ['vlad/T20261029-04']
permissions:
  contents: read
jobs:
  forced:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ashen-bastion
          key: godot-${{ hashFiles('.godot-version') }}
      - uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
          key: godot-import-${{ hashFiles('.godot-version', 'project.godot', 'assets/**', 'art/**', 'audio/**', '**/*.import') }}
      - run: |
          mkdir -p .gate
          export GODOT_BIN="$(bash tools/ci/ensure_godot.sh)"
          bash tools/ci/godot_import.sh .gate/import.log
          export V202_SLICES_FORCE=P,R,W,Z,E,A
          mkdir -p .gate/forced
          python3 tools/ci/shard.py config-files <(echo test/acceptance/test_acc_v202_wind_skills.gd) .gate/forced/c.json
          "$GODOT_BIN" --headless --verbose -s res://addons/gut/gut_cmdln.gd -gconfig=res://.gate/forced/c.json > .gate/forced/verbose.log 2>&1 || true
          grep -n "resources still\|Resource.*still\|leaked" .gate/forced/verbose.log | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v202-forced
          path: |
            .gate/forced/verbose.log
          retention-days: 7
